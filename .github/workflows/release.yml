name: Publish approved SDK release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: sdk-npm-release
  cancel-in-progress: false

jobs:
  validate:
    name: Prepare and test the release artifact
    if: github.repository == 'w1991e/sess-sdk'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.release.outputs.version }}
      dist-tag: ${{ steps.release.outputs.dist-tag }}
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      tarball-sha256: ${{ steps.record.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Require the exact version tag on reviewed master history
        id: release
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          const validVersion = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-rc\.(0|[1-9]\d*))?$/;
          if (process.env.GITHUB_REPOSITORY !== 'w1991e/sess-sdk' ||
              !validVersion.test(manifest.version) ||
              process.env.GITHUB_REF !== `refs/tags/v${manifest.version}` ||
              manifest.name !== '@sess.si/sdk' || manifest.private === true ||
              manifest.publishConfig?.access !== 'public') {
            throw new Error('Release identity, version or visibility guard failed.');
          }
          execFileSync('git', ['merge-base', '--is-ancestor', 'HEAD', 'refs/remotes/origin/master']);
          const distTag = manifest.version.includes('-rc.') ? 'next' : 'latest';
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${manifest.version}\ndist-tag=${distTag}\n`);
          JS
      - run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # All project code and dependency checks run without an OIDC publishing identity.
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - name: Record the tested artifact digest
        id: record
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync('.artifacts/package-result.json', 'utf8'));
          if (!/^[a-f0-9]{64}$/.test(result.sha256)) throw new Error('Invalid artifact digest.');
          appendFileSync(process.env.GITHUB_OUTPUT, `sha256=${result.sha256}\n`);
          JS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: artifact
        with:
          name: approved-sdk-${{ steps.release.outputs.version }}
          path: |
            .artifacts/package-result.json
            .artifacts/*.tgz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Make the candidate available for environment review
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync('.artifacts/package-result.json', 'utf8'));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `## Tested release candidate\n\nVersion: ${result.version}\n\n[Download the tested tarball and verification record](${process.env.ARTIFACT_URL})\n\nSHA-256: \`${result.sha256}\`\n\nThe protected publication job awaits maintainer approval. It will publish these exact bytes without rebuilding.\n`);
          JS

  publish:
    name: Publish the reviewed artifact
    needs: validate
    if: github.repository == 'w1991e/sess-sdk'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Configure required maintainer approval and release-tag restrictions in GitHub.
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_DIST_TAG: ${{ needs.validate.outputs.dist-tag }}
      EXPECTED_TARBALL_SHA256: ${{ needs.validate.outputs.tarball-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact-id }}
          path: .artifacts
          merge-multiple: true
      - name: Stage exactly the tested tarball with npm provenance (a maintainer approves with npm 2FA)
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          const result = JSON.parse(readFileSync('.artifacts/package-result.json', 'utf8'));
          // npm pack's JSON record is authoritative for the scoped archive filename.
          const filename = result.filename;
          const distTag = manifest.version.includes('-rc.') ? 'next' : 'latest';
          if (manifest.name !== '@sess.si/sdk' || result.name !== manifest.name ||
              !/^[A-Za-z0-9][A-Za-z0-9._-]*\.tgz$/.test(filename) ||
              manifest.version !== process.env.RELEASE_VERSION || result.version !== manifest.version ||
              distTag !== process.env.RELEASE_DIST_TAG ||
              result.tarball !== `.artifacts/${filename}` || result.node !== 'v24.21.0' ||
              result.sourceCommit !== process.env.GITHUB_SHA || result.sourceTreeDirty !== false) {
            throw new Error('Tested artifact does not match the approved release.');
          }
          const bytes = readFileSync(result.tarball);
          const sha256 = createHash('sha256').update(bytes).digest('hex');
          const integrity = `sha512-${createHash('sha512').update(bytes).digest('base64')}`;
          if (sha256 !== result.sha256 || sha256 !== process.env.EXPECTED_TARBALL_SHA256 ||
              integrity !== result.integrity) throw new Error('Tested bytes changed.');
          if (execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim() !== '11.19.0') throw new Error('Unexpected publisher version.');
          execFileSync('npm', ['stage', 'publish', result.tarball, '--ignore-scripts', '--provenance', '--access', 'public', '--tag', distTag], { stdio: 'inherit' });
          JS
      - name: Record the staged candidate for maintainer approval
        working-directory: ${{ github.workspace }}
        run: |
          {
            echo '## Staged — awaiting maintainer approval'
            echo
            echo "Staged ${RELEASE_VERSION} on dist-tag ${RELEASE_DIST_TAG}; not installable until approved."
            echo
            echo 'Maintainer: npm stage list <package> --json; npm stage download <stage-id>;'
            echo "check SHA-256 ${EXPECTED_TARBALL_SHA256}; npm stage view <stage-id> shows tag ${RELEASE_DIST_TAG}; npm stage approve <stage-id> (2FA)."
            echo 'The readback job waits up to 60 minutes; if it times out, approve, then re-run failed jobs.'
          } >> "$GITHUB_STEP_SUMMARY"

  readback:
    name: Verify the approved release in the registry
    needs: [validate, publish]
    if: github.repository == 'w1991e/sess-sdk'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    # No environment and no id-token: this job only reads the public registry after a maintainer
    # approves the staged version with npm 2FA.
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_DIST_TAG: ${{ needs.validate.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact-id }}
          path: .artifacts
          merge-multiple: true
      - name: Wait for a maintainer's staged-version approval
        working-directory: .
        run: |
          name="$(node -p "require('./package.json').name")"
          for attempt in $(seq 120); do
            if npm view "$name@$RELEASE_VERSION" version --prefer-online >/dev/null 2>&1; then exit 0; fi
            sleep 30
          done
          echo "$name@$RELEASE_VERSION is not yet approved; approve the staged version, then re-run failed jobs." >&2
          exit 1
      - name: Verify registry integrity, dist-tag and provenance metadata
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          import { setTimeout } from 'node:timers/promises';
          import { isDeepStrictEqual } from 'node:util';
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          const result = JSON.parse(readFileSync('.artifacts/package-result.json', 'utf8'));
          let verified = false;
          for (let attempt = 0; attempt < 6; attempt++) {
            try {
              const published = JSON.parse(execFileSync('npm', ['view', `${manifest.name}@${manifest.version}`, '--json', '--prefer-online'], { encoding: 'utf8' }));
              const tags = JSON.parse(execFileSync('npm', ['view', manifest.name, 'dist-tags', '--json', '--prefer-online'], { encoding: 'utf8' }));
              if (published.name !== manifest.name || published.version !== manifest.version ||
                  published.repository?.url !== manifest.repository.url ||
                  published.dist?.integrity !== result.integrity ||
                  tags[process.env.RELEASE_DIST_TAG] !== manifest.version ||
                  (manifest.version.includes('-rc.') && tags.latest === manifest.version) ||
                  !published.dist?.attestations?.url || !published.dist?.attestations?.provenance ||
                  !isDeepStrictEqual(published.dependencies, manifest.dependencies)) {
                throw new Error('Published metadata does not match the tested artifact.');
              }
              verified = true;
              break;
            } catch (error) {
              if (attempt === 5) throw error;
              await setTimeout(10000);
            }
          }
          if (!verified) throw new Error('Registry verification did not complete.');
          console.log(`Verified ${manifest.name}@${manifest.version}, ${process.env.RELEASE_DIST_TAG}, tested integrity and provenance metadata.`);
          JS
