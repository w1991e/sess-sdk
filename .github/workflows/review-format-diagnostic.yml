name: Temporary review formatting diagnostic
on:
  pull_request:
    paths:
      - .github/workflows/review-format-diagnostic.yml
permissions:
  contents: read
jobs:
  store-reviewed-document-blobs:
    if: github.repository == 'w1991e/sess-sdk' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.number == 2
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      # No checkout, dependency installation, project scripts, ref updates or commits.
      # These exact documents were prepared with the locked formatter in run 38355547631
      # and independently downloaded/hash-checked before this object-only upload.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '11792362492'
          run-id: '38355547631'
          github-token: ${{ github.token }}
          path: formatted
          merge-multiple: true
      - name: Verify exact reviewed bytes and store blobs without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          expected = {
              'README.md': ('2d60f34d6a2c1692514c6df26e80d8336e12f33dfaf5ec8a267b3d912cd7834a', '404aae3fd2950fc7824ff613360dc34e2f68835e'),
              'REPO_REVIEW.md': ('10a2b6bf5357c12dff62f7c936f59423922fc010399abad8227ffc54c685e201', 'e3cf140d3fa2d31f39d29e879f9ba71035daf2b9'),
          }
          if os.environ['GITHUB_REPOSITORY'] != 'w1991e/sess-sdk':
              raise SystemExit('Wrong repository')
          for name, (sha256, blob) in expected.items():
              data = (pathlib.Path('formatted') / name).read_bytes()
              if hashlib.sha256(data).hexdigest() != sha256:
                  raise SystemExit('Document identity mismatch')
              payload = json.dumps({'content': base64.b64encode(data).decode('ascii'), 'encoding': 'base64'}).encode()
              request = urllib.request.Request('https://api.github.com/repos/w1991e/sess-sdk/git/blobs', data=payload, method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=20) as response:
                  result = json.load(response)
              if result.get('sha') != blob:
                  raise SystemExit('Stored Git blob identity mismatch')
              print(name + ': ' + blob)
          PY
