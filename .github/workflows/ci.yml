name: SDK CI

on:
  pull_request:
  push:
    # Retained SDK source branches will also become public: scan each branch push.
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: sdk-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-history-scan:
    name: Source/history scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # This checkout SHA fetches all retained branches/tags with full history.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
      - name: Install version and integrity pinned scanner
        run: bash scripts/install-gitleaks.sh "$RUNNER_TEMP/sess-gitleaks-8.30.1"
      - name: Run synthetic source and removed-history controls
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/sess-gitleaks-8.30.1/gitleaks
        run: node --test scripts/test-source-scan.mjs
      - name: Scan complete tracked source and all retained refs/history
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/sess-gitleaks-8.30.1/gitleaks
        run: node scripts/scan-source-history.mjs
      - name: Retain only scanner metadata and outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-source-history-scan
          path: .artifacts/source-history-scan.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  check:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    name: Full checks / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.3', '24.21.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      # check builds once before tests/docs that consume the public dist exports.
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-package-node-${{ matrix.node }}
          path: |
            .artifacts/package-result.json
            .artifacts/*.tgz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  platform-smoke:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    name: Packed consumer / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run check:package
