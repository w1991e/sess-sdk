name: OpenClaw adapter CI

# Companion package @sess.si/openclaw (adapters/openclaw). Independent of the root SDK lanes in
# ci.yml, which stay unchanged. The SDK dependency installs from the public npm registry (the
# published @sess.si/sdk on dist-tag next) and must equal the single pin release/sdk-candidate.json
# in package.json, package-lock.json, the installed tree and the registry's dist.integrity.
on:
  pull_request:
  push:
    branches: ['master', 'adapters/openclaw-**']

permissions:
  contents: read

concurrency:
  group: openclaw-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: OpenClaw adapter / build, types, unit${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Existing check names are kept for Node 24.21.0. Node 24.16.0 is the declared engines
          # floor (package.json engines and compatibility.json), with its bundled npm.
          - { node: '24.21.0', label: '', artifact: '' }
          - { node: '24.16.0', label: ' (Node 24.16.0)', artifact: '-node-24.16.0' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Install adapter dependencies (registry SDK, integrity-locked)
        working-directory: adapters/openclaw
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify the installed SDK name, version and integrity against the pin
        working-directory: adapters/openclaw
        run: node scripts/registry-sdk.mjs --registry
      - name: Build
        working-directory: adapters/openclaw
        run: npm run build
      - name: Typecheck
        working-directory: adapters/openclaw
        run: npm run typecheck
      - name: Unit and contract tests
        working-directory: adapters/openclaw
        run: npm test

  packed-host:
    name: OpenClaw adapter / packed artifact and host install${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Existing check names are kept for Node 24.21.0. Node 24.16.0 is the declared engines
          # floor (package.json engines and compatibility.json), with its bundled npm.
          - { node: '24.21.0', label: '', artifact: '' }
          - { node: '24.16.0', label: ' (Node 24.16.0)', artifact: '-node-24.16.0' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - name: Install adapter dependencies (registry SDK, integrity-locked)
        working-directory: adapters/openclaw
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify the installed SDK name, version and integrity against the pin
        working-directory: adapters/openclaw
        run: node scripts/registry-sdk.mjs --registry
      - name: Build
        working-directory: adapters/openclaw
        run: npm run build
      - name: Packed artifact, consumer install, network-denied import and real host install
        working-directory: adapters/openclaw
        run: node scripts/check-package.mjs --registry --host
      - name: Production dependency audit
        working-directory: adapters/openclaw
        run: npm audit --omit=dev --omit=peer --audit-level=moderate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: openclaw-package${{ matrix.artifact }}
          path: |
            adapters/openclaw/.artifacts/package-result.json
            adapters/openclaw/.artifacts/*.tgz
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
