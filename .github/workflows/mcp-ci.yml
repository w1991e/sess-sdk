name: MCP adapter CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: mcp-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: MCP adapter / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Existing check names are kept; Node 22.14.0 is the SDK's minimum supported Node.
          - { label: ubuntu-24.04, os: ubuntu-24.04, node: '24.21.0' }
          - { label: macos-14, os: macos-14, node: '24.21.0' }
          - { label: Node 22.14.0, os: ubuntu-24.04, node: '22.14.0' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            adapters/mcp/package-lock.json
      # The documented maintainer path from a clean clone: npm ci installs the published
      # @sess.si/sdk registry tarball locked with the pinned integrity. It refuses a candidate-mode
      # lock; the repository root is not built or packed.
      - name: Maintainer setup (npm ci, registry @sess.si/sdk only)
        working-directory: adapters/mcp
        run: npm run setup
      # npm run check starts with sdk:verify: lock and installed record are the registry tarball
      # with the pinned integrity, and the re-read registry tarball's SHA-256/SHA-512 equal the pin.
      - name: Registry SDK identity and digests, build, typecheck, tests and packed consumer
        working-directory: adapters/mcp
        run: npm run check
      - name: Audit production dependencies
        working-directory: adapters/mcp
        run: npm audit --omit=dev --audit-level=moderate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcp-package-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            adapters/mcp/.artifacts/package-result.json
            adapters/mcp/.artifacts/*.tgz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  # The official MCP Registry's own validator on the checked-in server.json (validation only:
  # nothing is logged in to or published). `npm run check` above already validates it against the
  # vendored, SHA-256-pinned 2025-12-11 schema; this adds the registry's semantic checks. The
  # publisher binary is pinned by release and SHA-256 (v1.8.1, linux_amd64).
  registry:
    name: MCP adapter / registry server.json
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install the pinned mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/mcp-publisher"
          tar -xzf mcp-publisher.tar.gz -C "$RUNNER_TEMP/mcp-publisher" mcp-publisher
      - name: Validate server.json (no login, no publish)
        working-directory: adapters/mcp
        run: '"$RUNNER_TEMP/mcp-publisher/mcp-publisher" validate server.json'
