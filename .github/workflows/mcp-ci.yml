name: MCP adapter CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: mcp-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: MCP adapter / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Existing check names are kept; Node 22.14.0 is the SDK's minimum supported Node.
          - { label: ubuntu-24.04, os: ubuntu-24.04, node: '24.21.0' }
          - { label: macos-14, os: macos-14, node: '24.21.0' }
          - { label: Node 22.14.0, os: ubuntu-24.04, node: '22.14.0' }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            adapters/mcp/package-lock.json
      # The documented maintainer path from a clean clone: build and pack the SDK root, accept it only
      # if its bytes equal release/sdk-candidate.json, then npm ci.
      - name: Maintainer setup (pinned SDK candidate from the root, npm ci)
        working-directory: adapters/mcp
        run: npm run setup
      - name: Candidate digest, build, typecheck, tests and packed consumer
        working-directory: adapters/mcp
        run: npm run check
      - name: Audit production dependencies
        working-directory: adapters/mcp
        run: npm audit --omit=dev --audit-level=moderate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcp-package-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            adapters/mcp/.artifacts/package-result.json
            adapters/mcp/.artifacts/*.tgz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
