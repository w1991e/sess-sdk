# Policy fragment combined by scripts/scan-source-history.mjs with the SHA-pinned
# upstream rules. The upstream global suppression block is removed, so tracked
# lockfiles, scanner configuration, tests and every extension remain in scope.
# Any change to detection rules or exceptions requires non-author focused review.

[[rules]]
id = "sess-credential"
description = "SESS owner, trial-management, trial or management credential"
regex = '''sess_(?:sk|mg|tk|mk)_[A-Za-z0-9_-]{30,}'''
keywords = ["sess_sk_", "sess_mg_", "sess_tk_", "sess_mk_"]

[[rules.allowlists]]
description = "The single pinned public OpenAPI example, never an issued credential"
condition = "AND"
paths = ['''(?:^|/)contract/openapi\.json$''']
regexTarget = "line"
regexes = ['''^\s*"management_credential": "sess_mg_(?:SYNTHETICxEXAMPLExNOTxAxCREDENTIALxxxxxxxxx)",?\s*$''']

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Public synthetic replay identity exercises preserved punctuation bytes, not authentication"
condition = "AND"
paths = ['''(?:^|/)tests/unit/checkpoint-corrections\.test\.ts$''']
regexTarget = "line"
regexes = ['''^\s*const idempotencyKey = 'Original[.]Key[:]with_Bytes-128';\s*$''']

[[rules.allowlists]]
description = "Retained correction checkpoint's original exact synthetic replay-control definition, no credential"
condition = "AND"
paths = ['''(?:^|/)scripts/test-source-scan\.mjs$''']
regexTarget = "line"
regexes = ['''^\s*const identity = \['Original', 'Key[:]with_Bytes-128'\]\.join\('\.'\);\s*$''']

[[rules.allowlists]]
description = "Retained correction checkpoint's original exact replay-fixture regex definition, no credential"
condition = "AND"
paths = ['''(?:^|/)\.github/gitleaks\.toml$''']
regexTarget = "line"
regexes = ['''^\s*regexes = \['{3}\^\\s\*const idempotencyKey = 'Original\\[.]Key[:]with_Bytes-128';\\s\*\$'{3}\]\s*$''']

[[rules.allowlists]]
description = "S-07 QR parity vector: the exact synthetic link token of the Sess renderer's QR test vectors, no credential"
condition = "AND"
paths = ['''(?:^|/)tests/unit/qr\.test\.ts$''']
regexTarget = "line"
regexes = ['''^[\r\n]*const TOKEN = 'Ab[C]dEfGhIjKlMnOpQrStUvWxYz0123456789_-abcde';\s*$''']

[[rules]]
id = "aws-amazon-bedrock-api-key-short-lived"

[[rules.allowlists]]
description = "SHA-verified upstream detection regex contains a constant provider domain marker, no credential"
condition = "AND"
paths = ['''(?:^|/)\.github/gitleaks-upstream-v8\.30\.1\.toml$''']
regexTarget = "line"
regexes = ["^\\s*regex = '''bedrock-api-key-(?:YmVkcm9jay5hbWF6b25hd3MuY29t)'''\\s*$"]

[[rules]]
id = "sess-webhook-secret"
description = "Once-returned SESS webhook signing secret"
regex = '''whsec_[A-Za-z0-9+/]{43}='''
keywords = ["whsec_"]

[[rules]]
id = "sess-human-capability"
description = "Private hosted human capability URL"
regex = '''https?://[^\s"'<>]+/s/[A-Za-z0-9_-]{43}(?:[\s"'<>]|$)'''
keywords = ["/s/"]

[[rules]]
id = "private-key-header"
description = "Private key header, including truncated private material"
regex = '''-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'''
keywords = ["-----BEGIN"]
